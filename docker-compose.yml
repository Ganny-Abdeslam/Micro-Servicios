version: "3.8"
services:
  rabbit:
    image: rabbitmq:3.11-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  user-receiver:
    build: ./user-receiver
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbit:5672/"
      # PORT opcional
      PORT: 3000
    depends_on:
      - rabbit
    ports:
      - "3000:3000"

  messaging:
    build: ./messaging
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbit:5672/"
    depends_on:
      - rabbit
